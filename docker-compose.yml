services:
  db:
    image: postgres:16-alpine
    container_name: school-ai-search-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_ai_search}
      POSTGRES_USER: ${POSTGRES_USER:-schoolapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schoolapp}
    volumes:
      - school_ai_search_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schoolapp} -d ${POSTGRES_DB:-school_ai_search}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school-ai-search
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound to loopback by default: with a proxy in front, the app has no business being reachable
      # from the internet on its own port. Set APP_BIND=0.0.0.0 to publish it directly instead.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8787}:8787"
    environment:
      LOCAL_BACKEND_HOST: 0.0.0.0
      LOCAL_BACKEND_PORT: 8787
      LOCAL_STATIC_ROOT: /app/dist
      DATABASE_URL: ${DATABASE_URL:-postgres://schoolapp:schoolapp@db:5432/school_ai_search}
      DATABASE_SSL: "false"
      SCHOOL_NAME: ${SCHOOL_NAME:-eSchool}
      SCHOOL_TAGLINE: ${SCHOOL_TAGLINE:-Academic Excellence and Character}
      SCHOOL_ADDRESS: ${SCHOOL_ADDRESS:-}
      # Set to make a student ID card's QR code resolve to a URL rather than a bare number.
      ID_CARD_QR_BASE_URL: ${ID_CARD_QR_BASE_URL:-}
      BUILD_NUMBER: ${BUILD_NUMBER:-}

      # --- Sessions and platform access -----------------------------------------------------
      # SESSION_SECRET signs every session cookie. Leave it unset and the app generates a key at
      # startup instead, which means everyone is signed out on each restart and sessions do not
      # work across replicas. Generate one with: openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:-}
      # The operator's credential for /owner — listing, creating and suspending schools. Unset means
      # platform administration is refused outright, so no school can be created. Same generator.
      PLATFORM_OWNER_TOKEN: ${PLATFORM_OWNER_TOKEN:-}
      # Encrypts a school's own AI provider keys at rest. Without it a school cannot store one and
      # is told so, rather than having it written to the database in clear. openssl rand -hex 32
      SECRETS_KEY: ${SECRETS_KEY:-}
      # The root domain: decides which origins may call the API cross-origin, and builds the link in
      # a school's activation email.
      TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:-eschool.ink}
      # Extra origins allowed cross-origin, comma-separated. Only for a separately hosted frontend.
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      # Local testing only. On, the X-Tenant header overrides the Host and picks the school — which
      # in production would let any page on the internet name whichever school it wanted.
      ALLOW_TENANT_HEADER: ${ALLOW_TENANT_HEADER:-}

      # --- Multi-tenancy ---------------------------------------------------------------------
      # Unset = one school, exactly as before. TENANTS is the static form; CONTROL_DATABASE_URL is
      # the dynamic one that also powers self-service signup.
      TENANTS: ${TENANTS:-}
      CONTROL_DATABASE_URL: ${CONTROL_DATABASE_URL:-}
      # A role WITH CREATEDB, used only to CREATE DATABASE for each new school.
      PROVISION_ADMIN_DATABASE_URL: ${PROVISION_ADMIN_DATABASE_URL:-}
      # How the app connects to each school's database; {db} is replaced with the generated name.
      TENANT_DB_URL_TEMPLATE: ${TENANT_DB_URL_TEMPLATE:-}
      TENANT_DB_PREFIX: ${TENANT_DB_PREFIX:-school_}

      # --- Subscriptions ---------------------------------------------------------------------
      # Signup is refused until SUBSCRIPTION_AMOUNT is set above zero.
      SUBSCRIPTION_AMOUNT: ${SUBSCRIPTION_AMOUNT:-}
      SUBSCRIPTION_CURRENCY: ${SUBSCRIPTION_CURRENCY:-UGX}
      SUBSCRIPTION_PERIOD_DAYS: ${SUBSCRIPTION_PERIOD_DAYS:-120}
      SUBSCRIPTION_GRACE_DAYS: ${SUBSCRIPTION_GRACE_DAYS:-14}
      # Providers must sign webhooks: x-webhook-signature = HMAC-SHA256(rawBody, secret). Unset
      # disables verification, so anyone could POST a fake "paid" and provision a school for free.
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}

      # --- Activation email ------------------------------------------------------------------
      # 'mock' (the default) never sends; 'http' posts to a Resend-compatible API.
      EMAIL_MODE: ${EMAIL_MODE:-mock}
      EMAIL_API_URL: ${EMAIL_API_URL:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      AI_DEFAULT_MODEL_ID: ${AI_DEFAULT_MODEL_ID:-local-rules}
      # Unset by default: global search falls back to the basic student search until Meilisearch runs.
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-}
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-}
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:-}
      MCP_SERVER_TOKENS: ${MCP_SERVER_TOKENS:-}
      AI_MODEL_CATALOG: ${AI_MODEL_CATALOG:-}
      AI_EXTRA_MODELS: ${AI_EXTRA_MODELS:-}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-900}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_VERSION: ${ANTHROPIC_VERSION:-2023-06-01}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY:-}
      GOOGLE_GEMINI_MODEL: ${GOOGLE_GEMINI_MODEL:-gemini-2.5-flash}
      GOOGLE_GEMINI_BASE_URL: ${GOOGLE_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.1-8b-instruct}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-http://localhost}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-School AI Search}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b}
      PAYMENT_GATEWAY_MODE: ${PAYMENT_GATEWAY_MODE:-mock}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-UGX}
      PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-}
      MTN_MOMO_BASE_URL: ${MTN_MOMO_BASE_URL:-https://sandbox.momodeveloper.mtn.com}
      MTN_MOMO_SUBSCRIPTION_KEY: ${MTN_MOMO_SUBSCRIPTION_KEY:-}
      MTN_MOMO_API_USER: ${MTN_MOMO_API_USER:-}
      MTN_MOMO_API_KEY: ${MTN_MOMO_API_KEY:-}
      MTN_MOMO_TARGET_ENVIRONMENT: ${MTN_MOMO_TARGET_ENVIRONMENT:-sandbox}
      AIRTEL_MONEY_BASE_URL: ${AIRTEL_MONEY_BASE_URL:-}
      AIRTEL_MONEY_CLIENT_ID: ${AIRTEL_MONEY_CLIENT_ID:-}
      AIRTEL_MONEY_CLIENT_SECRET: ${AIRTEL_MONEY_CLIENT_SECRET:-}
      AIRTEL_MONEY_COUNTRY: ${AIRTEL_MONEY_COUNTRY:-UG}
      AIRTEL_MONEY_TOKEN_PATH: ${AIRTEL_MONEY_TOKEN_PATH:-/auth/oauth2/token}
      AIRTEL_MONEY_COLLECTION_PATH: ${AIRTEL_MONEY_COLLECTION_PATH:-/merchant/v1/payments/}
      BANK_PAYMENT_GATEWAY_URL: ${BANK_PAYMENT_GATEWAY_URL:-}
      BANK_PAYMENT_API_KEY: ${BANK_PAYMENT_API_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then((r)=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional. Behind a profile so `docker compose up` is unchanged for anyone not using search:
  # start it with `docker compose --profile search up -d`.
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: school-ai-search-meili
    profiles: ["search", "librechat"]
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-masterKey}
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_NO_ANALYTICS: "true"
    ports:
      # Loopback only. The browser never talks to Meilisearch — the app does, over the compose
      # network — so publishing it on 0.0.0.0 only ever exposed the index to the internet.
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    volumes:
      - school_ai_search_meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional. LibreChat reaches into this app over MCP for school data — see Settings →
  # Search & LibreChat for the librechat.yaml block and a token. It brings its own MongoDB, and
  # reuses the Meilisearch above for its conversation search.
  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: school-ai-search-librechat
    profiles: ["librechat"]
    restart: unless-stopped
    depends_on:
      - librechat-mongo
      - meilisearch
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Loopback only: reach it through the proxy or an SSH tunnel, not from the open internet.
      - "127.0.0.1:${LIBRECHAT_PORT:-3080}:3080"
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: mongodb://librechat-mongo:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-masterKey}
      # The token LibreChat presents to this app's MCP server. Issue it via MCP_SERVER_TOKENS.
      SCHOOLBOT_MCP_TOKEN: ${SCHOOLBOT_MCP_TOKEN:-}
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro

  librechat-mongo:
    image: mongo:7
    container_name: school-ai-search-librechat-mongo
    profiles: ["librechat"]
    restart: unless-stopped
    volumes:
      - school_ai_search_librechat_mongo:/data/db

  # ---------------------------------------------------------------------------------------------
  # TLS termination. Two options, one profile each — bring up exactly one of them.
  #
  #   docker compose --profile proxy-nginx up -d    # you manage the certificate
  #   docker compose --profile proxy-caddy up -d    # Caddy manages the certificate
  #
  # Both preserve the Host header, which is what chooses the school, and both pass
  # X-Forwarded-Proto so the app knows to mark the session cookie Secure.
  # ---------------------------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: school-ai-search-nginx
    profiles: ["proxy-nginx"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      # Put fullchain.pem and privkey.pem for *.eschool.ink here. A wildcard needs a DNS-01
      # challenge — see the header of deploy/nginx/docker.conf.
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - school_ai_search_certbot_webroot:/var/www/certbot

  caddy:
    image: caddy:2-alpine
    container_name: school-ai-search-caddy
    profiles: ["proxy-caddy"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The DNS provider token Caddy uses for the DNS-01 challenge, which a wildcard requires.
      TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:-eschool.ink}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - school_ai_search_caddy_data:/data
      - school_ai_search_caddy_config:/config

volumes:
  school_ai_search_postgres_data:
  school_ai_search_certbot_webroot:
  school_ai_search_caddy_data:
  school_ai_search_caddy_config:
  school_ai_search_meili_data:
  school_ai_search_librechat_mongo:
  
