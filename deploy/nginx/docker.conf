# nginx inside docker-compose, in front of the `app` service.
#
# Mounted read-only at /etc/nginx/conf.d/default.conf by the `nginx` service in docker-compose.yml.
# Start it with:  docker compose --profile proxy-nginx up -d
#
# It differs from deploy/nginx/eschool.ink.conf in exactly two ways: it proxies to the compose
# service name instead of loopback, and it reads certificates from a mounted directory instead of
# /etc/letsencrypt. Everything else — Host preservation, forwarded headers, timeouts, body size —
# is the same, because those are properties of the app and not of where nginx runs.
#
# TLS. A wildcard certificate cannot be issued over HTTP-01, so obtain it on the host with a DNS-01
# challenge and mount it in:
#
#   sudo certbot certonly --dns-cloudflare \
#     --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#     -d eschool.ink -d '*.eschool.ink'
#   sudo cp -L /etc/letsencrypt/live/eschool.ink/{fullchain,privkey}.pem deploy/nginx/certs/
#
# Renewal is a copy and a `docker compose exec nginx nginx -s reload`. If you would rather not think
# about that at all, use the Caddy profile instead — it renews a wildcard by itself.

# Deliberately NOT an `upstream` block.
#
# nginx resolves the hosts in an upstream block once, at startup, and caches the address for its
# whole lifetime. Docker gives a container a new IP every time it is recreated, so after any
# `up -d --force-recreate app` nginx would go on dialling the old address and answer 502 — with the
# app perfectly healthy — until nginx itself was restarted.
#
# Naming the backend in a variable forces nginx to resolve it per request, through Docker's embedded
# DNS at 127.0.0.11, so a redeployed app is picked up within `valid=`.

server {
    listen 80;
    server_name eschool.ink *.eschool.ink;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name eschool.ink *.eschool.ink;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Base64 student photos, school logos and long curriculum documents. The 1 MB default rejects
    # them with a bare 413.
    client_max_body_size 25m;

    # Security headers come from the app itself, on every response, so they are not repeated here.

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $app_upstream app:8787;
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;

        # The school is chosen from the Host header. Rewriting it sends every school to the default
        # tenant, which is a silent wrong-data bug rather than an error.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Host  $host;

        # Stripped rather than forwarded, so a client cannot name a school it was not sent to.
        proxy_set_header X-Tenant "";

        # The app uses no WebSockets, and an unconditional `Connection: upgrade` would stop nginx
        # reusing connections to it. Empty is what enables keep-alive on HTTP/1.1.
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }
}
