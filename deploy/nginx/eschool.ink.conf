# nginx site for eschool.ink — for nginx installed on the host, in front of `npm start` or a
# docker-compose app whose port is published to 127.0.0.1.
#
# Install:
#   sudo cp deploy/nginx/eschool.ink.conf /etc/nginx/sites-available/eschool.ink
#   sudo ln -s /etc/nginx/sites-available/eschool.ink /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: every school is a subdomain, so this needs a **wildcard** certificate, and a wildcard cannot
# be issued over the HTTP-01 challenge — it must be DNS-01. With certbot and, for example, Cloudflare:
#
#   sudo certbot certonly --dns-cloudflare \
#     --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#     -d eschool.ink -d '*.eschool.ink'
#
# Renewal is automatic; nothing here changes when it renews.
#
# DNS: an A record for `eschool.ink` and an A record for `*.eschool.ink`, both pointing at this
# server. No per-school DNS work — a school provisioned at 10pm is reachable immediately.

upstream eschool_app {
    # The app binds 8787. Keep it on loopback so the only way in is through this proxy.
    server 127.0.0.1:8787;
    keepalive 32;
}

# Everything on port 80 is redirected, except the ACME challenge if you ever use HTTP-01 for the
# apex. The app itself never expects plain HTTP in production.
server {
    listen 80;
    listen [::]:80;
    server_name eschool.ink *.eschool.ink;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # The wildcard covers every school; the apex covers the marketing page and /signup.
    server_name eschool.ink *.eschool.ink;

    ssl_certificate     /etc/letsencrypt/live/eschool.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eschool.ink/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Student photos and school logos are posted as base64 data URLs, and a curriculum document can
    # be two million characters. nginx's 1 MB default would reject those with a bare 413.
    client_max_body_size 25m;

    # The app already sets HSTS, nosniff, X-Frame-Options and Referrer-Policy on every response
    # (server/http/security-headers.mjs). Adding them here too would send each header twice, so
    # they are deliberately absent.

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    location / {
        proxy_pass http://eschool_app;
        proxy_http_version 1.1;

        # THE important one. The school is chosen from the Host header, so rewriting it — which
        # `proxy_set_header Host $proxy_host` would do — would send every school to the default
        # tenant and quietly serve the wrong data.
        proxy_set_header Host              $host;

        # Without this the app cannot tell it was reached over TLS, and would mark the session
        # cookie non-Secure and skip HSTS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Host  $host;

        # Never forwarded from the client: the app honours X-Tenant only when ALLOW_TENANT_HEADER
        # is on, but stripping it here means a misconfiguration cannot become a data leak.
        proxy_set_header X-Tenant "";

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Writing a paper with a local model can take minutes; the 60s default would return 504
        # halfway through a generation the school has already paid for in tokens.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # PDFs and AI replies are generated, not files on disk — stream them straight through.
        proxy_buffering off;
    }
}
